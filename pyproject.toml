[project]
name = "quickmedia"
version = "0.1.0"
description = "本地素材管理工具 — 扫描、标签、AI 分析"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
]

[project.scripts]
quickmedia = "quickmedia.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
audio = [
    "faster-whisper>=1.0",
]
text = [
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
]
embedding = [
    "chromadb>=0.5",
    "jieba>=0.42",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "quickmedia[mcp]",
    "quickmedia[dev,web,audio,text,embedding]",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quickmedia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
