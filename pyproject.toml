[project]
name = "quickmedia"
version = "0.1.0"
description = "本地素材管理工具 — 扫描、标签、AI 分析"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
quickmedia = "quickmedia.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
all = [
    "quickmedia[dev,web]",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quickmedia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
